limit_req_zone $binary_remote_addr zone=owner_admin_rate:10m rate=5r/s;
log_format owner_admin_safe '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name owner-admin.149077530.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name owner-admin.149077530.xyz;

    ssl_certificate /etc/letsencrypt/live/owner-admin.149077530.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/owner-admin.149077530.xyz/privkey.pem;

    access_log /var/log/nginx/owner-admin.access.log owner_admin_safe;
    error_log /var/log/nginx/owner-admin.error.log warn;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    auth_basic "Owner Admin";
    auth_basic_user_file /etc/nginx/owner-admin.htpasswd;
    limit_req zone=owner_admin_rate burst=10 nodelay;

    location = /admin {
        proxy_pass http://127.0.0.1:18082;
        include /etc/nginx/proxy_params;
        proxy_set_header Authorization "";
        proxy_set_header Host owner-admin.149077530.xyz;
        proxy_set_header X-Owner-Admin-Authenticated "1";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:18082;
        include /etc/nginx/proxy_params;
        proxy_set_header Authorization "";
        proxy_set_header Host owner-admin.149077530.xyz;
        proxy_set_header X-Owner-Admin-Authenticated "1";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location = /api/admin {
        proxy_pass http://127.0.0.1:18082;
        include /etc/nginx/proxy_params;
        proxy_set_header Authorization "";
        proxy_set_header Host owner-admin.149077530.xyz;
        proxy_set_header X-Owner-Admin-Authenticated "1";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:18082;
        include /etc/nginx/proxy_params;
        proxy_set_header Authorization "";
        proxy_set_header Host owner-admin.149077530.xyz;
        proxy_set_header X-Owner-Admin-Authenticated "1";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
